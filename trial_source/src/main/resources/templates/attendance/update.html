<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>勤怠情報変更｜LMS</title>
</head>
<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" th:object="${attendanceForm}"  method="post">
				<!-- 岩月 - Task.27 入力エラーメッセージ -->
				<div th:if="${#fields.hasAnyErrors()}">
					<ul style = "padding-left:0; list-style: none;">
						<li th:each="error : ${#fields.allErrors()}">
							<span th:text=" ${'* ' + error}" class="help-inline error"></span>
						</li>
					</ul>
				</div>
				<table class="table table-hover dataTable no-footer">
					<thead>
	<tr>
		<th class="w140">日付</th>
		<th class="w300">コース内容</th>
		<!-- 岩月 - Task.28 定時ボタン用の列 -->
		<th class ="w60"></th>

		<!-- 岩月 - Task.26 出退勤時間のプルダウン化に伴い各列の表示幅を調整 -->
		<th style="min-width: 155px;">出勤</th>
		<th style="min-width: 155px;">退勤</th>
		<th style="min-width: 120px;">中抜け時間</th>
		<th style="min-width: 90px;">ステータス</th>

		<th class="w240">備考</th>
	</tr>
</thead>
					<tbody>
						<!-- 岩月 - Task.27 Listの変更 -->
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w300">[[${dailyAttendanceForm.sectionName}]]</td>
								
								<!-- 岩月 - Task.28 定時ボタン -->
								<td class = "w60">
									<input type="button"
									 class="btn btn-success"
									 value="定時"
									 onclick="setRegularTime(this)"/>
								</td>
<!-- 岩月 - Task.26 出勤時間を見やすい時・分プルダウン表示に変更 -->
<td style="min-width: 155px; white-space: nowrap;">
	<div style="display: flex; align-items: center; gap: 5px;">
		<select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|"
				class="form-control"
				style="width: 68px; min-width: 68px; flex-shrink: 0;">
			<option th:each="hour : ${attendanceForm.hourMap}"
					th:value="${hour.key}"
					th:selected="${hour.key == dailyAttendanceForm.trainingStartTimeHour}">
				[[${hour.value}]]
			</option>
		</select>

		<span>:</span>

		<select th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|"
				class="form-control"
				style="width: 68px; min-width: 68px; flex-shrink: 0;">
			<option th:each="minute : ${attendanceForm.minuteMap}"
					th:value="${minute.key}"
					th:selected="${minute.key == dailyAttendanceForm.trainingStartTimeMinute}">
				[[${minute.value}]]
			</option>
		</select>
	</div>
</td>

<!-- 岩月 - Task.26 退勤時間を見やすい時・分プルダウン表示に変更 -->
<td style="min-width: 155px; white-space: nowrap;">
	<div style="display: flex; align-items: center; gap: 5px;">
		<select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|"
				class="form-control"
				style="width: 68px; min-width: 68px; flex-shrink: 0;">
			<option th:each="hour : ${attendanceForm.hourMap}"
					th:value="${hour.key}"
					th:selected="${hour.key == dailyAttendanceForm.trainingEndTimeHour}">
				[[${hour.value}]]
			</option>
		</select>

		<span>:</span>

		<select th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|"
				class="form-control"
				style="width: 68px; min-width: 68px; flex-shrink: 0;">
			<option th:each="minute : ${attendanceForm.minuteMap}"
					th:value="${minute.key}"
					th:selected="${minute.key == dailyAttendanceForm.trainingEndTimeMinute}">
				[[${minute.value}]]
			</option>
		</select>
	</div>
</td>
								
								<td style="min-width: 120px;">
	<select th:name="|attendanceList[${stat.index}].blankTime|"
			class="form-control">
		<option th:each="blankTime : ${attendanceForm.blankTimes}"
				th:value="${blankTime.key}"
				th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">
			[[${blankTime.value}]]
		</option>
	</select>
</td>

<td style="min-width: 90px;">
	[[${dailyAttendanceForm.statusDispName}]]
</td>
								<td class="w240">
									<input type="text" th:name="|attendanceList[${stat.index}].note|" th:value="${dailyAttendanceForm.note}" class="form-control"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<!-- 岩月 - Task.27 更新確認ダイアログ -->
					<input type="submit" value="更新" name="complete" class="btn btn-info"  onclick="return resistCheck();"/>
				</div>

			</form>
		</div>
	</div>
	<!-- 岩月 - Task.27 更新確認ダイアログ -->
	<script type="text/javascript">
		function resistCheck(){
			return confirm("更新します。よろしいですか？")
		}
	</script>
	<!-- 岩月 - Task.28 定時ボタン -->
	<script type="text/javascript">
    function setRegularTime(button) {
        const row = button.closest("tr");

        setTime(row, "trainingStartTimeHour", 9);
        setTime(row, "trainingStartTimeMinute", 0);
        setTime(row, "trainingEndTimeHour", 18);
        setTime(row, "trainingEndTimeMinute", 0);
    }

    function setTime(row, fieldName, time) {
        const select = row.querySelector('select[name$=".' + fieldName + '"]');
        const option = Array.from(select.options).find(
            item => item.value !== "" && Number(item.value) === time
        );
        if (option) {
            select.value = option.value;
        }
    }
</script>

</body>
</html>
